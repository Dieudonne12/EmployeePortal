name: Employee Portal CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build application
      run: dotnet build --no-restore --configuration Release
    - name: Run tests
      run: dotnet test EmployeePortal.Tests/EmployeePortal.Tests.csproj --no-restore --configuration Release


    
